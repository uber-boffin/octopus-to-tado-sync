name: Run Tado-Octopus Script

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 12pm UTC
    - cron: '0 12 * * *'

jobs:
  run_script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # for the keep-alive step
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialise playwright
      run: |
        playwright install

    - name: Run Python script
      run: |
        python sync_octopus_tado.py \
          --tado-email "${{ secrets.TADO_EMAIL }}" \
          --tado-password "${{ secrets.TADO_PASSWORD }}" \
          --mprn "${{ secrets.OCTOPUS_MPRN }}" \
          --gas-serial-number "${{ secrets.OCTOPUS_GAS_SERIAL }}" \
          --octopus-api-key "${{ secrets.OCTOPUS_API_KEY }}"

    # GitHub disables scheduled workflows after 60 days without a commit.
    # Re-enabling the workflow via the API resets that timer, without commits.
    - name: Keep schedule alive
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/schedule_sync.yml/enable"
